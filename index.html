<title>Get the Travel VIP App</title>
<script>

    var IOS = "https://apps.apple.com/us/app/travel-vip/id1663614675";
    var ANDROID = "https://play.google.com/store/apps/details?id=ai.txv2.starter";
    var ua = navigator.userAgent || navigator.vendor || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
    if (isIOS) { location.replace(IOS); }
    else if (/android/i.test(ua)) { location.replace(ANDROID); }
  })();
</script>
