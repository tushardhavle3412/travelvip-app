<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel VIP</title>
<script>
  (function () {
    var IOS = "https://apps.apple.com/us/app/travel-vip/id1663614675";
    var ANDROID = "https://play.google.com/store/apps/details?id=ai.txv2.starter";
    var ua = navigator.userAgent || "";
    // Apple devices (iPhone, iPad, Mac) -> App Store; everything else -> Google Play
    var apple = /iPhone|iPad|iPod|Macintosh/i.test(ua);
    location.replace(apple ? IOS : ANDROID);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://play.google.com/store/apps/details?id=ai.txv2.starter"></noscript>
</head>
<body></body>
</html>
